<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Материалы по тегу — Дайджест</title>
    <link rel="stylesheet" href="../assets/css/app.css" />
  </head>
  <body data-page="tag">
    <header class="site-header">
      <a class="wordmark" href="../index.html"
        ><span class="brand-symbol">Д</span><span>ДАЙДЖЕСТ</span></a
      >
      <form class="search-form" action="../index.html" method="get">
        <label class="visually-hidden" for="tag-search">Поиск новостей</label
        ><input id="tag-search" name="q" placeholder="Поиск новостей" /><button
          class="icon-button search-button"
          type="submit"
          aria-label="Найти"
        >
          ⌕
        </button>
      </form>
      <nav class="header-actions">
        <button
          class="icon-button theme-toggle"
          type="button"
          aria-label="Переключить тему"
          title="Переключить тему"
        >
          ◐</button
        ><span id="account-actions"
          ><a class="text-button" href="../login/index.html">Войти</a></span
        >
      </nav>
    </header>
    <main class="content-shell">
      <p class="eyebrow">Подборка</p>
      <h1 id="tag-title">Материалы по тегу</h1>
      <div class="article-list" id="tag-list">
        <article class="article-row">
          <div class="article-copy">
            <div class="article-meta">Тег новостного портала</div>
            <h3>Здесь отобразятся связанные материалы</h3>
            <p>Подборка формируется по тегам статей в базе данных.</p>
          </div>
        </article>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-brand">Дайджест · новости с контекстом</div>
      <nav class="footer-links">

      </nav>
      <small>2026</small>
    </footer>
    <script src="../assets/js/app.js" defer></script>
  </body>
</html>
