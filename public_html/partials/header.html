<header class="site-header">
  <a class="wordmark" href="/" aria-label="Дайджест, главная"
    ><span class="brand-symbol">Д</span><span>ДАЙДЖЕСТ</span></a
  >
  <form class="search-form" action="/" method="get" role="search">
    <label class="visually-hidden" for="site-search">Поиск новостей</label
    ><input
      id="site-search"
      type="search"
      name="q"
      placeholder="Поиск новостей"
    /><button
      class="icon-button search-button"
      type="submit"
      aria-label="Найти"
    >
      ⌕
    </button>
  </form>
  <nav class="header-actions" aria-label="Главное меню">
    <button class="header-tool-button random-article" type="button">
      Случайная статья</button
    ><a class="rss-link" href="/rss.xml">RSS</a
    ><button
      class="icon-button theme-toggle"
      type="button"
      aria-label="Переключить тему"
      title="Переключить тему"
    >
      ◐</button
    ><span id="account-actions"
      ><a class="text-button" href="/login">Войти</a>
      <a class="primary-button compact" href="/register">Регистрация</a></span
    >
  </nav>
</header>
